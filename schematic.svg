<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, sans-serif" font-size="13">

  <style>
    .lbl  { font-size: 13px; fill: #111; }
    .val  { font-size: 11px; fill: #444; }
    .pin  { font-size: 13px; fill: #111; font-weight: bold; }
    .head { font-size: 16px; font-weight: bold; fill: #111; }
    .note { font-size: 11px; fill: #555; font-style: italic; }
    .iso  { font-size: 11px; fill: #c00; font-weight: bold; }
    line  { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- background -->
  <rect width="1200" height="700" fill="white"/>
  <rect x="8" y="8" width="1184" height="684" fill="none" stroke="#bbb" stroke-width="1"/>

  <!-- title -->
  <text x="600" y="36" text-anchor="middle" class="head">CV Tap Tempo Mod — schemat ideowy (jeden pedał)</text>

  <!-- ══════════════════════════════════════════════════════
       LINIA IZOLACJI GALWANICZNEJ (pionowa, przerywana)
       ══════════════════════════════════════════════════════ -->
  <line x1="720" y1="55" x2="720" y2="645" stroke="#c00" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="660" y="68" text-anchor="middle" class="iso">GND modular</text>
  <text x="800" y="68" text-anchor="middle" class="iso">GND pedału</text>

  <!-- ═══════════════════════════════════════
       ŚCIEŻKA A / B  (y = 200 → A=140, B=260)
       ═══════════════════════════════════════ -->

  <!-- Jack A -->
  <circle cx="68" cy="140" r="15" fill="white" stroke="black" stroke-width="2"/>
  <text x="68" y="136" text-anchor="middle" class="pin">●</text>
  <text x="52" y="122" class="lbl">CV A</text>
  <text x="52" y="136" class="val">jack</text>
  <!-- sleeve GND_mod -->
  <line x1="68" y1="155" x2="68" y2="176" stroke="black" stroke-width="2"/>
  <line x1="55" y1="176" x2="81" y2="176" stroke="black" stroke-width="2.5"/>
  <line x1="60" y1="184" x2="76" y2="184" stroke="black" stroke-width="2.5"/>
  <line x1="65" y1="192" x2="71" y2="192" stroke="black" stroke-width="2.5"/>
  <text x="68" y="208" text-anchor="middle" class="val">GND_mod</text>
  <!-- tip wire right -->
  <line x1="83" y1="140" x2="160" y2="140" stroke="black" stroke-width="2"/>

  <!-- Jack B -->
  <circle cx="68" cy="270" r="15" fill="white" stroke="black" stroke-width="2"/>
  <text x="68" y="266" text-anchor="middle" class="pin">●</text>
  <text x="52" y="252" class="lbl">CV B</text>
  <text x="52" y="266" class="val">jack</text>
  <!-- sleeve GND_mod -->
  <line x1="68" y1="285" x2="68" y2="306" stroke="black" stroke-width="2"/>
  <line x1="55" y1="306" x2="81" y2="306" stroke="black" stroke-width="2.5"/>
  <line x1="60" y1="314" x2="76" y2="314" stroke="black" stroke-width="2.5"/>
  <line x1="65" y1="322" x2="71" y2="322" stroke="black" stroke-width="2.5"/>
  <text x="68" y="338" text-anchor="middle" class="val">GND_mod</text>
  <!-- tip wire right -->
  <line x1="83" y1="270" x2="160" y2="270" stroke="black" stroke-width="2"/>

  <!-- SELECT switch -->
  <circle cx="160" cy="140" r="4" fill="black"/>
  <circle cx="160" cy="270" r="4" fill="black"/>
  <circle cx="220" cy="205" r="4" fill="black"/>
  <line x1="160" y1="140" x2="218" y2="205" stroke="black" stroke-width="2"/>
  <line x1="160" y1="270" x2="218" y2="205" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="126" y="212" text-anchor="end" class="lbl">SELECT</text>
  <text x="126" y="226" text-anchor="end" class="val">A / OFF / B</text>

  <!-- drut od common SELECT do HP -->
  <line x1="220" y1="205" x2="290" y2="205" stroke="black" stroke-width="2"/>

  <!-- ═══════════════════
       FILTR HP (x: 290–460)
       ═══════════════════ -->

  <circle cx="290" cy="205" r="5" fill="black"/>
  <line x1="290" y1="205" x2="290" y2="163" stroke="black" stroke-width="2"/>

  <!-- SW_HP bypass -->
  <line x1="290" y1="163" x2="338" y2="163" stroke="black" stroke-width="2"/>
  <circle cx="338" cy="163" r="4" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="370" cy="163" r="4" fill="none" stroke="black" stroke-width="2"/>
  <line x1="374" y1="163" x2="460" y2="163" stroke="black" stroke-width="2"/>
  <line x1="460" y1="163" x2="460" y2="205" stroke="black" stroke-width="2"/>
  <text x="354" y="151" text-anchor="middle" class="lbl">SW_HP</text>
  <text x="354" y="139" text-anchor="middle" class="val">bypass (norm. otwarty)</text>

  <!-- C1 (0.1µF) -->
  <line x1="290" y1="205" x2="360" y2="205" stroke="black" stroke-width="2"/>
  <line x1="360" y1="188" x2="360" y2="222" stroke="black" stroke-width="3"/>
  <line x1="369" y1="188" x2="369" y2="222" stroke="black" stroke-width="3"/>
  <line x1="369" y1="205" x2="460" y2="205" stroke="black" stroke-width="2"/>
  <text x="364" y="181" text-anchor="middle" class="lbl">C1</text>
  <text x="364" y="168" text-anchor="middle" class="val">0.1µF</text>

  <!-- node_AB -->
  <circle cx="460" cy="205" r="5" fill="black"/>

  <!-- R1 shunt 10kΩ do GND_mod -->
  <line x1="460" y1="205" x2="460" y2="231" stroke="black" stroke-width="2"/>
  <rect x="445" y="231" width="30" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="500" y="249" class="lbl">R1</text>
  <text x="500" y="263" class="val">10kΩ</text>
  <line x1="460" y1="281" x2="460" y2="310" stroke="black" stroke-width="2"/>
  <line x1="445" y1="310" x2="475" y2="310" stroke="black" stroke-width="2.5"/>
  <line x1="450" y1="318" x2="470" y2="318" stroke="black" stroke-width="2.5"/>
  <line x1="455" y1="326" x2="465" y2="326" stroke="black" stroke-width="2.5"/>
  <text x="460" y="342" text-anchor="middle" class="val">GND_mod</text>

  <!-- R2 (470Ω) od node_AB do D1/LED -->
  <line x1="460" y1="205" x2="502" y2="205" stroke="black" stroke-width="2"/>
  <rect x="502" y="191" width="54" height="28" fill="white" stroke="black" stroke-width="2"/>
  <text x="529" y="203" text-anchor="middle" class="val">R2</text>
  <text x="529" y="215" text-anchor="middle" class="val">470Ω</text>
  <line x1="556" y1="205" x2="580" y2="205" stroke="black" stroke-width="2"/>

  <!-- ═══════════════════
       D1 (1N4148) antyparalel do LED OC1
       Rysujemy jako diodę przy LED wejściu OC1
       ═══════════════════ -->
  <!-- junction -->
  <circle cx="580" cy="205" r="5" fill="black"/>
  <!-- dioda antyparalel — w dół, anoda na górze (katoda LED), katoda na dole (anoda LED) -->
  <line x1="580" y1="205" x2="580" y2="213" stroke="black" stroke-width="2"/>
  <!-- trójkąt diody: wierzchołek u dołu (kierunek odwrotny do LED) -->
  <polygon points="580,231 571,213 589,213" fill="black"/>
  <!-- katoda bar -->
  <line x1="569" y1="231" x2="591" y2="231" stroke="black" stroke-width="2.5"/>
  <!-- drut od katody D1 do GND_mod -->
  <line x1="580" y1="231" x2="580" y2="258" stroke="black" stroke-width="2"/>
  <line x1="567" y1="258" x2="593" y2="258" stroke="black" stroke-width="2.5"/>
  <line x1="572" y1="266" x2="588" y2="266" stroke="black" stroke-width="2.5"/>
  <line x1="577" y1="274" x2="583" y2="274" stroke="black" stroke-width="2.5"/>
  <text x="597" y="218" class="val">D1</text>
  <text x="597" y="230" class="val">1N4148</text>
  <text x="597" y="244" class="val">⟂ LED</text>

  <!-- ═══════════════════
       OC1 (PC817) — blok DIP-4
       Lewy blok: LED (piny 1,2) x=620–680, y=180–230
       Prawy blok: fototranzystor (piny 4,3) x=680–740, y=180–230
       ═══════════════════ -->
  <!-- obudowa -->
  <rect x="612" y="178" width="120" height="56" fill="#f0f8ff" stroke="black" stroke-width="2" rx="4"/>
  <!-- linia separacji wewnętrzna -->
  <line x1="672" y1="180" x2="672" y2="232" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- etykieta -->
  <text x="672" y="173" text-anchor="middle" class="lbl" font-weight="bold">OC1  PC817</text>
  <!-- LED symbol (lewа połowa) -->
  <line x1="634" y1="196" x2="634" y2="216" stroke="black" stroke-width="1.5"/>
  <polygon points="634,196 648,206 634,216" fill="black"/>
  <line x1="648" y1="196" x2="648" y2="216" stroke="black" stroke-width="2"/>
  <!-- strzałki światła -->
  <line x1="650" y1="195" x2="660" y2="182" stroke="black" stroke-width="1.5"/>
  <line x1="655" y1="200" x2="665" y2="187" stroke="black" stroke-width="1.5"/>
  <!-- piny LED -->
  <text x="616" y="198" class="val">1+</text>
  <text x="616" y="222" class="val">2−</text>
  <!-- fototranzystor symbol (prawa połowa) -->
  <line x1="696" y1="186" x2="696" y2="226" stroke="black" stroke-width="2"/>
  <line x1="696" y1="194" x2="726" y2="176" stroke="black" stroke-width="1.5"/>
  <line x1="696" y1="218" x2="726" y2="236" stroke="black" stroke-width="1.5"/>
  <polygon points="714,228 726,236 718,240" fill="black"/>
  <!-- piny fototranzystora -->
  <text x="728" y="180" class="val">4C</text>
  <text x="728" y="240" class="val">3E</text>

  <!-- drut CV → pin1 LED OC1 -->
  <line x1="580" y1="205" x2="612" y2="205" stroke="black" stroke-width="2"/>
  <!-- pin1 → wewnętrzna anoda LED -->
  <line x1="612" y1="205" x2="634" y2="206" stroke="black" stroke-width="2"/>
  <!-- pin2 katoda LED → GND_mod -->
  <line x1="612" y1="216" x2="596" y2="216" stroke="black" stroke-width="2"/>
  <line x1="596" y1="216" x2="596" y2="310" stroke="black" stroke-width="2"/>
  <line x1="581" y1="310" x2="611" y2="310" stroke="black" stroke-width="2.5"/>
  <line x1="586" y1="318" x2="606" y2="318" stroke="black" stroke-width="2.5"/>
  <line x1="591" y1="326" x2="601" y2="326" stroke="black" stroke-width="2.5"/>
  <text x="596" y="342" text-anchor="middle" class="val">GND_mod</text>

  <!-- kolektor OC1 (pin4) → tap_pin -->
  <line x1="732" y1="176" x2="870" y2="176" stroke="black" stroke-width="2"/>
  <!-- emiter OC1 (pin3) → GND_ped -->
  <line x1="732" y1="236" x2="800" y2="236" stroke="black" stroke-width="2"/>
  <line x1="800" y1="236" x2="800" y2="310" stroke="black" stroke-width="2"/>
  <line x1="785" y1="310" x2="815" y2="310" stroke="black" stroke-width="2.5"/>
  <line x1="790" y1="318" x2="810" y2="318" stroke="black" stroke-width="2.5"/>
  <line x1="795" y1="326" x2="805" y2="326" stroke="black" stroke-width="2.5"/>
  <text x="800" y="342" text-anchor="middle" class="val">GND_ped</text>

  <!-- ═══════════════════════════════════════
       ŚCIEŻKA C  (y = 490)
       ═══════════════════════════════════════ -->

  <!-- Jack C -->
  <circle cx="68" cy="490" r="15" fill="white" stroke="black" stroke-width="2"/>
  <text x="68" y="486" text-anchor="middle" class="pin">●</text>
  <text x="52" y="472" class="lbl">CV C</text>
  <text x="52" y="486" class="val">jack (zawsze)</text>
  <!-- sleeve GND_mod -->
  <line x1="68" y1="505" x2="68" y2="526" stroke="black" stroke-width="2"/>
  <line x1="55" y1="526" x2="81" y2="526" stroke="black" stroke-width="2.5"/>
  <line x1="60" y1="534" x2="76" y2="534" stroke="black" stroke-width="2.5"/>
  <line x1="65" y1="542" x2="71" y2="542" stroke="black" stroke-width="2.5"/>
  <text x="68" y="558" text-anchor="middle" class="val">GND_mod</text>
  <!-- tip wire right -->
  <line x1="83" y1="490" x2="140" y2="490" stroke="black" stroke-width="2"/>

  <!-- C2 (0.1µF) -->
  <line x1="140" y1="473" x2="140" y2="507" stroke="black" stroke-width="3"/>
  <line x1="149" y1="473" x2="149" y2="507" stroke="black" stroke-width="3"/>
  <line x1="149" y1="490" x2="230" y2="490" stroke="black" stroke-width="2"/>
  <text x="144" y="466" text-anchor="middle" class="lbl">C2</text>
  <text x="144" y="453" text-anchor="middle" class="val">0.1µF</text>

  <!-- node_C -->
  <circle cx="230" cy="490" r="5" fill="black"/>

  <!-- R3 (10kΩ) shunt do GND_mod -->
  <line x1="230" y1="490" x2="230" y2="516" stroke="black" stroke-width="2"/>
  <rect x="215" y="516" width="30" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="268" y="534" class="lbl">R3</text>
  <text x="268" y="548" class="val">10kΩ</text>
  <line x1="230" y1="566" x2="230" y2="592" stroke="black" stroke-width="2"/>
  <line x1="215" y1="592" x2="245" y2="592" stroke="black" stroke-width="2.5"/>
  <line x1="220" y1="600" x2="240" y2="600" stroke="black" stroke-width="2.5"/>
  <line x1="225" y1="608" x2="235" y2="608" stroke="black" stroke-width="2.5"/>
  <text x="230" y="624" text-anchor="middle" class="val">GND_mod</text>

  <!-- R4 (470Ω) od node_C -->
  <line x1="230" y1="490" x2="272" y2="490" stroke="black" stroke-width="2"/>
  <rect x="272" y="476" width="54" height="28" fill="white" stroke="black" stroke-width="2"/>
  <text x="299" y="488" text-anchor="middle" class="val">R4</text>
  <text x="299" y="500" text-anchor="middle" class="val">470Ω</text>
  <line x1="326" y1="490" x2="350" y2="490" stroke="black" stroke-width="2"/>

  <!-- D2 (1N4148) antyparalel do LED OC2 -->
  <circle cx="350" cy="490" r="5" fill="black"/>
  <line x1="350" y1="490" x2="350" y2="498" stroke="black" stroke-width="2"/>
  <polygon points="350,516 341,498 359,498" fill="black"/>
  <line x1="339" y1="516" x2="361" y2="516" stroke="black" stroke-width="2.5"/>
  <line x1="350" y1="516" x2="350" y2="542" stroke="black" stroke-width="2"/>
  <line x1="337" y1="542" x2="363" y2="542" stroke="black" stroke-width="2.5"/>
  <line x1="342" y1="550" x2="358" y2="550" stroke="black" stroke-width="2.5"/>
  <line x1="347" y1="558" x2="353" y2="558" stroke="black" stroke-width="2.5"/>
  <text x="366" y="503" class="val">D2</text>
  <text x="366" y="515" class="val">1N4148</text>
  <text x="366" y="529" class="val">⟂ LED</text>

  <!-- OC2 (PC817) -->
  <rect x="382" y="462" width="120" height="56" fill="#f0f8ff" stroke="black" stroke-width="2" rx="4"/>
  <line x1="442" y1="464" x2="442" y2="516" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="442" y="457" text-anchor="middle" class="lbl" font-weight="bold">OC2  PC817</text>
  <!-- LED symbol -->
  <line x1="404" y1="480" x2="404" y2="500" stroke="black" stroke-width="1.5"/>
  <polygon points="404,480 418,490 404,500" fill="black"/>
  <line x1="418" y1="480" x2="418" y2="500" stroke="black" stroke-width="2"/>
  <line x1="420" y1="479" x2="430" y2="466" stroke="black" stroke-width="1.5"/>
  <line x1="425" y1="484" x2="435" y2="471" stroke="black" stroke-width="1.5"/>
  <text x="385" y="482" class="val">1+</text>
  <text x="385" y="506" class="val">2−</text>
  <!-- fototranzystor -->
  <line x1="466" y1="470" x2="466" y2="510" stroke="black" stroke-width="2"/>
  <line x1="466" y1="478" x2="496" y2="460" stroke="black" stroke-width="1.5"/>
  <line x1="466" y1="502" x2="496" y2="520" stroke="black" stroke-width="1.5"/>
  <polygon points="484,512 496,520 488,524" fill="black"/>
  <text x="498" y="464" class="val">4C</text>
  <text x="498" y="524" class="val">3E</text>

  <!-- drut R4 → pin1 LED OC2 -->
  <line x1="350" y1="490" x2="382" y2="490" stroke="black" stroke-width="2"/>
  <line x1="382" y1="490" x2="404" y2="490" stroke="black" stroke-width="2"/>
  <!-- pin2 katoda LED → GND_mod -->
  <line x1="382" y1="500" x2="366" y2="500" stroke="black" stroke-width="2"/>
  <line x1="366" y1="500" x2="366" y2="592" stroke="black" stroke-width="2"/>
  <line x1="351" y1="592" x2="381" y2="592" stroke="black" stroke-width="2.5"/>
  <line x1="356" y1="600" x2="376" y2="600" stroke="black" stroke-width="2.5"/>
  <line x1="361" y1="608" x2="371" y2="608" stroke="black" stroke-width="2.5"/>
  <text x="366" y="624" text-anchor="middle" class="val">GND_mod</text>

  <!-- kolektor OC2 (pin4) → tap_pin -->
  <line x1="502" y1="460" x2="870" y2="460" stroke="black" stroke-width="2"/>
  <!-- emiter OC2 (pin3) → GND_ped -->
  <line x1="502" y1="520" x2="800" y2="520" stroke="black" stroke-width="2"/>
  <line x1="800" y1="520" x2="800" y2="560" stroke="black" stroke-width="2"/>
  <line x1="785" y1="560" x2="815" y2="560" stroke="black" stroke-width="2.5"/>
  <line x1="790" y1="568" x2="810" y2="568" stroke="black" stroke-width="2.5"/>
  <line x1="795" y1="576" x2="805" y2="576" stroke="black" stroke-width="2.5"/>
  <text x="800" y="592" text-anchor="middle" class="val">GND_ped</text>

  <!-- ═══════════════════════════════════════
       KOLEKTORY → tap_pin
       ═══════════════════════════════════════ -->

  <!-- pionowa linia łącząca kolektory -->
  <line x1="870" y1="176" x2="870" y2="460" stroke="black" stroke-width="2"/>
  <circle cx="870" cy="176" r="5" fill="black"/>
  <circle cx="870" cy="460" r="5" fill="black"/>
  <!-- węzeł tap_pin -->
  <circle cx="870" cy="318" r="5" fill="black"/>
  <line x1="870" y1="318" x2="960" y2="318" stroke="black" stroke-width="2"/>

  <!-- blok tap_pin -->
  <rect x="960" y="296" width="130" height="44" fill="#eef4ff" stroke="#3366cc" stroke-width="2.5" rx="6"/>
  <text x="1025" y="314" text-anchor="middle" class="lbl" font-weight="bold">tap_pin</text>
  <text x="1025" y="330" text-anchor="middle" class="val">PCB pedału (~3.3V)</text>

  <!-- ═══════════════════
       PRZEŁĄCZNIK REC
       ═══════════════════ -->
  <line x1="1025" y1="340" x2="1025" y2="390" stroke="black" stroke-width="2"/>
  <circle cx="1025" cy="390" r="4" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="1025" cy="420" r="4" fill="none" stroke="black" stroke-width="2"/>
  <line x1="1025" y1="424" x2="1025" y2="472" stroke="black" stroke-width="2"/>
  <text x="1041" y="404" class="lbl">REC</text>
  <text x="1041" y="418" class="val">ON / OFF</text>
  <!-- GND_ped pod REC -->
  <line x1="1010" y1="472" x2="1040" y2="472" stroke="black" stroke-width="2.5"/>
  <line x1="1015" y1="480" x2="1035" y2="480" stroke="black" stroke-width="2.5"/>
  <line x1="1020" y1="488" x2="1030" y2="488" stroke="black" stroke-width="2.5"/>
  <text x="1025" y="504" text-anchor="middle" class="val">GND_ped</text>

  <!-- ═══════════════════════════════════════
       RAMKI SEKCJI
       ═══════════════════════════════════════ -->

  <!-- wejścia A/B + SELECT -->
  <rect x="26" y="116" width="256" height="180" fill="none" stroke="#aaa" stroke-width="1.5"
        stroke-dasharray="7,4" rx="5"/>
  <text x="34" y="113" class="val" fill="#888">wejścia A / B + SELECT</text>

  <!-- wejście C -->
  <rect x="26" y="462" width="200" height="80" fill="none" stroke="#aaa" stroke-width="1.5"
        stroke-dasharray="7,4" rx="5"/>
  <text x="34" y="459" class="val" fill="#888">wejście C (zawsze aktywne)</text>

  <!-- filtr HP A/B -->
  <rect x="278" y="128" width="198" height="230" fill="none" stroke="#aaa" stroke-width="1.5"
        stroke-dasharray="7,4" rx="5"/>
  <text x="286" y="125" class="val" fill="#888">filtr HP  (fc ≈ 160 Hz, τ ≈ 1 ms)</text>

  <!-- ═══════════════════════════════════════
       PRZYPISY
       ═══════════════════════════════════════ -->
  <line x1="20" y1="648" x2="1180" y2="648" stroke="#ddd" stroke-width="1"/>
  <text x="26" y="663" class="note">SW_HP: norm. otwarty = filtr HP aktywny (gate skracany do ~1ms);  zwarty = bypass (CV bezpośrednio do LED)</text>
